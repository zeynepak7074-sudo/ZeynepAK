    <main>
        <h2 class="section-title">Bizimle İletişime Geçin</h2>
        
        <div class="form-container" style="max-width: 500px;">
            <form id="contactForm" onsubmit="formGonder(event)">
                <div class="form-group">
                    <label for="name">Adınız Soyadınız:</label>
                    <input type="text" id="name" required placeholder="Adınızı yazınız...">
                </div>
                
                <div class="form-group">
                    <label for="email">E-posta Adresiniz:</label>
                    <input type="email" id="email" required placeholder="ornek@eposta.com">
                </div>
                
                <div class="form-group">
                    <label for="message">Mesajınız:</label>
                    <textarea id="message" rows="5" required placeholder="Mesajınızı buraya bırakabilirsiniz..."></textarea>
                </div>
                
                <button type="submit" class="btn-card" style="width: 100%; margin-top: 10px;">Mesajı Gönder</button>
            </form>
        </div>
    </main>
